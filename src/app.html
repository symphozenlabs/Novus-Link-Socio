<!doctype html>
<html lang="en-IN" class="no-js">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#190030" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Runs before paint: enables JS-only styles and picks the motion mode so the
			// cinematic layout never flashes in for reduced-motion visitors.
			(function () {
				var d = document.documentElement;
				d.classList.remove('no-js');
				d.classList.add('js');
				var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
				d.classList.add(rm ? 'reduced-motion' : 'motion');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
